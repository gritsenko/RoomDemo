<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room 07 — Cyberpunk Survival Quest Prototype</title>
  <link rel="preload" href="./fonts/pixel.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Pixel';
      src: url('fonts/pixel.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-color: #06080c;
      --cyan-glow: #2cdbf0;
      --amber-glow: #f09235;
      --red-alert: #e63946;
      --border-metal: #23374a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: #c5dbee;
      font-family: 'Pixel', 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Top telemetry header */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 42px;
      background: rgba(10, 14, 20, 0.95);
      border-bottom: 1px solid var(--border-metal);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .top-bar .title {
      color: var(--cyan-glow);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-bar .status-badge {
      background: rgba(44, 219, 240, 0.1);
      border: 1px solid var(--cyan-glow);
      color: var(--cyan-glow);
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 11px;
    }

    .top-bar .cycle-indicator {
      color: var(--amber-glow);
      font-weight: bold;
    }

    .top-bar .controls-hint {
      color: #698299;
      font-size: 12px;
    }

    .btn-cyber {
      background: #121c27;
      color: var(--cyan-glow);
      border: 1px solid #2e5572;
      padding: 4px 12px;
      font-family: 'Pixel', 'Share Tech Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }

    .btn-cyber:hover, .btn-cyber.active {
      background: var(--cyan-glow);
      color: #06080c;
      box-shadow: 0 0 10px rgba(44, 219, 240, 0.5);
    }

    /* Canvas stage container with letterbox ratio */
    #game-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 42px);
      margin-top: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020305;
      overflow: hidden;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95), 0 0 20px rgba(44, 219, 240, 0.15);
      outline: 1px solid #1a2a3a;
    }

    /* Audio unlock prompt */
    #audio-prompt {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 22, 32, 0.95);
      border: 1px solid var(--amber-glow);
      color: var(--amber-glow);
      padding: 8px 18px;
      font-size: 12px;
      border-radius: 4px;
      z-index: 1001;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      animation: pulseAlert 1.5s infinite;
      transition: opacity 0.3s;
    }

    @keyframes pulseAlert {
      0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.8; transform: translateX(-50%) scale(0.98); }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-ZbSflkxr.js"></script>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="title">
      <span>MODULE 07</span>
      <span class="status-badge" id="simStatus">SIM_ACTIVE</span>
      <span class="cycle-indicator" id="cycleBadge">ЦИКЛ #1</span>
    </div>
    <div class="controls-hint">
      Клик по полу — Шаг | Клик по объекту — Меню действий
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button id="resetCycleBtn" class="btn-cyber">ПЕРЕЗАПУСК ЦИКЛА</button>
    </div>
  </header>

  <!-- Game Canvas Container -->
  <div id="game-container">
  </div>

  <div id="audio-prompt">🔊 Кликните в любом месте для включения звукового синтезатора</div>

</body>
</html>
